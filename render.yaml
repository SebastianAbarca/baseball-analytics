services:
  - type: web
    name: baseball-construction
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # $7/month — upgrade if needed
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false        # set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false        # set manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
