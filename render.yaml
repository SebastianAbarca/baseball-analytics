services:
  - type: web
    name: baseball-construction
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 512 MB — measured usage is ~200 MB
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false

      # ANON, not SERVICE. The anon key respects Row Level Security and is
      # designed to be handed out; RLS limits it to SELECT on the serving
      # tables (schema_serving.sql), so the dashboard can read published data
      # and do nothing else.
      #
      # This used to be SUPABASE_SERVICE_KEY — an RLS-bypassing admin
      # credential on a public, unauthenticated dashboard whose entire use of
      # it was downloading one JSON file. Anything that got code execution
      # here got the database.
      - key: SUPABASE_ANON_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
