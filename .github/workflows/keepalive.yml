name: Database keepalive

# The free-tier Supabase project pauses after about a week without activity,
# and the dashboard reads straight from it, so a paused project is a dead site.
# The weekly seed job was not enough on its own: it ran on 2026-09-21 and the
# project had paused (NXDOMAIN) by the 2026-09-28 run. Every two days leaves
# room for GitHub's scheduling delays.
#
# It reads exactly what the dashboard reads, with the same anon key, so a
# failure here means the site is broken too — GitHub emails on a failed run.

on:
  schedule:
    - cron: '17 9 */2 * *'   # 09:17 UTC every other day
  workflow_dispatch:

# GitHub switches off every scheduled workflow in a public repository after 60
# days without repository activity — and October to March is longer than
# that. Disabled, this ping stops, the database pauses a week later and the
# site goes with it; the nightly build would not wake up for the season either.
# Re-enabling them through the API resets that clock without a commit.
permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in keepalive.yml nightly.yml seed.yml; do
            gh workflow enable "$wf"
            echo "$wf: $(gh workflow view "$wf" --json state -q .state)"
          done

      - name: Read one published portrait key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -sS --fail-with-body --max-time 60 \
            "$SUPABASE_URL/rest/v1/portraits?select=team,season&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$body"
          # A 200 with an empty list means the table is there but nothing is
          # published — the site would show nothing, so fail on that too.
          echo "$body" | grep -q '"season"'
